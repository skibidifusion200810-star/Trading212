services:
  - type: web
    name: goldx-trading
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: goldx-postgres
          property: connectionString
databases:
  - name: goldx-postgres
    plan: free
    region: frankfurt
    databaseName: goldx
    user: goldx_user
