# Backend only. The static website is published by GitHub Pages.
# Uses an EXISTING Render PostgreSQL database: no new free database created.
services:
  - type: web
    name: goldx-trading
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: FRONTEND_ORIGIN
        value: https://skibidifusion200810-star.github.io
      - key: SESSION_SECRET
        generateValue: true
      # Fill the DATABASE_URL with your existing Render Postgres Internal Database URL
      # in the Render service Environment tab. For an existing Blueprint, sync:false
      # values are not re-prompted during subsequent syncs.
      - key: DATABASE_URL
        sync: false
